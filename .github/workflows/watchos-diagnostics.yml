name: Build watchOS route diagnostics

on:
  push:
    branches:
      - watchos26-route-diagnostics
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print selected Xcode and watchOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Convert Xcode project format for older CI runner (temporary only)
        run: |
          sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' HermesEnabler2.xcodeproj/project.pbxproj
      - name: Compile the Watch application without signing
        run: |
          xcodebuild \
            -project HermesEnabler2.xcodeproj \
            -scheme HermesEnabler2 \
            -configuration Debug \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
