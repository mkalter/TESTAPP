name: Build watchOS route diagnostics

on:
  push:
    branches:
      - watchos26-route-diagnostics
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print selected Xcode and watchOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Convert Xcode project format for older CI runner (temporary only)
        run: |
          sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' HermesEnabler2.xcodeproj/project.pbxproj
      - name: Compile the Watch application without signing
        run: |
          xcodebuild \
            -project HermesEnabler2.xcodeproj \
            -scheme HermesEnabler2 \
            -configuration Debug \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned iPhone + Watch testing IPA
        run: |
          bash scripts/create_ipa.sh \
            --output build/ipa/HermesEnabler-watchOS26-route-tests.ipa
      - name: Upload unsigned test IPA
        uses: actions/upload-artifact@v4
        with:
          name: HermesEnabler-watchOS26-route-tests-unsigned
          path: build/ipa/HermesEnabler-watchOS26-route-tests.ipa
          if-no-files-found: error
