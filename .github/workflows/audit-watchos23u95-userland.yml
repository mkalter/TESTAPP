name: Inspect watchOS 23U95 MobileGestalt system services

on:
  push:
    branches:
      - research/watchos23u95-userland-services-20261117
    paths:
      - '.github/workflows/audit-watchos23u95-userland.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-userland:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IPSW_URL: https://updates.cdn-apple.com/2026FallFCS/fullrestores/140-55248/8E7A8791-70C2-4E38-A107-EB6665AE3BCA/Watch6%2C18_26.6.1_23U95_Restore.ipsw
      TOOL_URL: https://github.com/blacktop/ipsw/releases/download/v3.1.749/ipsw_3.1.749_linux_x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned blacktop ipsw
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ipswcli extracted audit
          curl -fLsS --retry 3 "$TOOL_URL" -o /tmp/ipswcli/tool.tar.gz
          tar -xzf /tmp/ipswcli/tool.tar.gz -C /tmp/ipswcli
          chmod +x /tmp/ipswcli/ipsw
          /tmp/ipswcli/ipsw version > audit/version.txt
          /tmp/ipswcli/ipsw extract --help > audit/extract-help.txt 2>&1
          /tmp/ipswcli/ipsw macho --help > audit/macho-help.txt 2>&1
          /tmp/ipswcli/ipsw class-dump --help > audit/classdump-help.txt 2>&1
          echo "Watch6,18 watchOS 26.6.1 build 23U95 exact Apple CDN IPSW" > audit/provenance.txt
          echo "URL $IPSW_URL" >> audit/provenance.txt
          echo 'Extracted via APFS HTTP ranges; full IPSW digest not verified' >> audit/provenance.txt

      - name: Fetch current ipsw source (new APFS range implementation)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/blacktop/ipsw.git /tmp/ipsw-latest
          (cd /tmp/ipsw-latest && git rev-parse HEAD) > audit/ipsw-source-commit.txt
          grep 'go 1.27' /tmp/ipsw-latest/go.mod

      - name: Install source-compatible Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/ipsw-latest/go.mod
          cache: false

      - name: Build latest ipsw with sandbox support
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ipsw-latest
          go version
          timeout 700 go build -o /tmp/ipswcli/ipsw ./cmd/ipsw
          /tmp/ipswcli/ipsw extract --help > "$GITHUB_WORKSPACE/audit/extract-help-current.txt" 2>&1
          grep -F -- '--ranged' "$GITHUB_WORKSPACE/audit/extract-help-current.txt"
          /tmp/ipswcli/ipsw version > "$GITHUB_WORKSPACE/audit/tool-version-current.txt" 2>&1

      - name: Extract MobileGestalt and ContainerManager executables and launch manifests
        shell: bash
        run: |
          set +e
          PATTERN='^/(usr/libexec/(MobileGestaltHelper|containermanagerd(_system)?|mobilegestaltd)|System/Library/LaunchDaemons/com\.apple\.[^/]*(MobileGestalt|mobilegestalt|containermanager)[^/]*\.plist|usr/lib/system/libsystem_containermanager\.dylib|usr/lib/libMobileGestalt\.dylib|System/Library/PrivateFrameworks/ContainerManager(Common|System|User)\.framework/(Versions/A/)?ContainerManager(Common|System|User)|System/Library/PrivateFrameworks/MobileContainerManager\.framework/(Versions/A/)?MobileContainerManager)$'
          echo "$PATTERN" > audit/pattern.txt
          timeout 960 /tmp/ipswcli/ipsw extract --remote --files --ranged \
            --pattern "$PATTERN" --output "$PWD/extracted" "$IPSW_URL" \
            > audit/ranged-extract.log 2>&1
          echo "$?" > audit/ranged-extract.exit
          find extracted -type f -printf '%p %s bytes\n' | sort > audit/extracted-files.txt
          tail -n 80 audit/ranged-extract.log
          cat audit/extracted-files.txt
          exit 0

      - name: Examine system service binary metadata offline
        shell: bash
        run: |
          set +e
          mkdir -p audit/metadata audit/strings audit/headers
          count=0
          while IFS= read -r -d '' f; do
            count=$((count+1))
            safe="$(printf '%s' "$f" | tr '/ ' '__')"
            {
              printf 'source=%s\n' "$f"
              sha256sum "$f"
              file "$f"
              stat -c 'size=%s' "$f"
            } > "audit/metadata/$safe.txt"
            if [[ "$f" = *.plist ]]; then
              python3 -c 'import sys,plistlib; d=plistlib.load(open(sys.argv[1],"rb")); print("format: plist"); [print(k, ":", d[k]) for k in ("Label","Program","ProgramArguments","MachServices","KeepAlive","UserName","GroupName") if isinstance(d,dict) and k in d]' "$f" > "audit/headers/$safe.txt" 2>&1
            else
              strings -a -n 6 "$f" | grep -Ei \
                'MobileGestalt|rebuildCache|setCacheSentinel|MGRebuild|MGSetAnswer|MGCopyAnswer|CacheData|CacheExtra|container|sandbox|entitle|setCache|mach-lookup|XPC|system.group|read-write|file-issue' \
                | head -n 250 > "audit/strings/$safe.txt" || true
              timeout 60 /tmp/ipswcli/ipsw macho info "$f" \
                > "audit/headers/$safe.macho.txt" 2>&1
              echo "macho_exit=$?" >> "audit/metadata/$safe.txt"
              timeout 60 /tmp/ipswcli/ipsw class-dump "$f" \
                > "audit/headers/$safe.objc.txt" 2>&1
              echo "classdump_exit=$?" >> "audit/metadata/$safe.txt"
            fi
          done < <(find extracted -type f -print0)
          echo "FILES_ANALYZED=$count" | tee audit/status.txt
          if [[ "$count" -eq 0 ]]; then
            echo 'BLOCKED: no APFS files extracted. No independent userland inference.' >> audit/status.txt
          fi
          exit 0

      - name: Archive only report files, never Apple binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchos-23u95-userland-authority-audit
          path: audit/
          if-no-files-found: error
          retention-days: 14
