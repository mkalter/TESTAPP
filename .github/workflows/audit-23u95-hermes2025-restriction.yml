name: Verify original 23U95 Hermes2025 restriction vs MobileGestalt

on:
  push:
    branches:
      - experiment/watchos23u95-native-face-boundary-lab-20261117
    paths:
      - '.github/workflows/audit-23u95-hermes2025-restriction.yml'
      - 'Research/firmware-23u95/audit_hermes2025_original_restriction.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-hermes-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IPSW_URL: https://updates.cdn-apple.com/2026FallFCS/fullrestores/140-55248/8E7A8791-70C2-4E38-A107-EB6665AE3BCA/Watch6%2C18_26.6.1_23U95_Restore.ipsw
      EXPECTED_HERMES_SHA: ca8f29bd478483d5bfcd6a30cae9f324a37e2655e0515a27929596df4dc9af49
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original signed Apple face inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original audit
          git clone --depth 1 https://github.com/blacktop/ipsw.git /tmp/ipsw-source
          git -C /tmp/ipsw-source rev-parse HEAD > audit/ipsw-source-commit.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/ipsw-source/go.mod
          cache: false
      - name: Compile original firmware extractor
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/ipsw-source && timeout 780 go build -o /tmp/ipsw ./cmd/ipsw)
          /tmp/ipsw version > audit/extractor-version.txt 2>&1
      - name: Extract ONLY original 23U95 Hermes2025 executable
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='^/System/Library/NanoTimeKit/FaceBundles/NTKHermes2025FaceBundle\.bundle/NTKHermes2025FaceBundle$'
          timeout 1000 /tmp/ipsw extract --remote --files --ranged \
            --pattern "$PATTERN" --output "$PWD/original" "$IPSW_URL" \
            > audit/partial-extraction-log.txt 2>&1
          find original -type f -printf '%p %s bytes\n' > audit/original-files.txt
          BIN="$(find original -type f -name NTKHermes2025FaceBundle -print -quit)"
          test -n "$BIN" && test -f "$BIN"
          ACTUAL="$(sha256sum "$BIN" | cut -d' ' -f1)"
          test "$ACTUAL" = "$EXPECTED_HERMES_SHA"
          echo "Original Apple binary SHA256 = $ACTUAL; matched exact Watch6,18/23U95 reference" | tee audit/source-verification.txt
          python3 -m venv /tmp/audit-python
          /tmp/audit-python/bin/pip -q install 'capstone>=5,<6'
          /tmp/audit-python/bin/python Research/firmware-23u95/audit_hermes2025_original_restriction.py \
            --original "$BIN" --output audit/original-hermes2025-restriction-vs-brand.json \
            | tee audit/restriction-summary.txt
          rm -rf original
      - name: Publish original callsite metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch6-18-23u95-original-Hermes2025-isRestrictedForDevice-audit
          path: audit/
          retention-days: 14
          if-no-files-found: error
